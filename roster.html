<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bainz rostering</title>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FDF7EE;--card:#FFFBF5;--blush:#F0DACB;--mahogany:#6B1A1A;--ink:#2A2420;--muted:#8C8075;--line:rgba(13,13,13,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Khand",sans-serif;font-weight:700;font-size:34px;color:var(--mahogany);margin:0;line-height:1.1}
h2{font-family:"Khand",sans-serif;font-weight:700;font-size:24px;color:var(--mahogany);margin:32px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 0}
.controls{display:flex;flex-wrap:wrap;gap:16px;margin:18px 0 4px}
.ctl label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;font:inherit;font-size:14px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--mahogany);color:var(--cream)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(min-width:640px){.cards{grid-template-columns:repeat(5,1fr)}}
@media(max-width:639px){.card.wide{grid-column:span 2}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-family:"Khand",sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.card .n{font-size:12px;color:var(--muted);margin-top:2px}
.card.hl{background:var(--mahogany);color:var(--cream)}
.card.hl .k,.card.hl .n{color:var(--blush)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.banner{background:var(--blush);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 0;padding-bottom:4px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;font:inherit;font-size:14px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--mahogany);border-color:var(--mahogany);color:var(--cream)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.shifts{list-style:none;margin:6px 0 0;padding:0}
.shifts li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.shifts li:last-child{border-bottom:0}
.shifts .h{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr.closed td{color:var(--muted)}
.chip{display:inline-block;min-width:38px;text-align:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.chip.over{background:var(--blush);color:var(--mahogany)}
.chip.short{background:var(--mahogany);color:var(--cream)}
.chip.ok{color:var(--muted);font-weight:400}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--blush);vertical-align:middle;margin-right:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.day summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.day summary::-webkit-details-marker{display:none}
.day .dname{font-weight:600}
.day .dmeta{font-size:13px;color:var(--muted)}
.day .body{padding:0 14px 12px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.over{background:var(--blush);color:var(--mahogany)}
.pill.short{background:var(--mahogany);color:var(--cream)}
.pill.ok{color:var(--muted)}
.rules{font-size:14px}
.rules li{margin:4px 0}
.owner{border:1px dashed rgba(107,26,26,.35)}
.ctl input.date{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.who{margin-top:10px}.whoh{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.tw table{margin-top:0}
.qt td.st,.qt th.st{position:sticky;left:0;background:var(--card);z-index:1}
.qt th.pc{vertical-align:bottom;padding:4px 1px;min-width:22px;text-align:center}
.qt th.pc span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11px;color:var(--ink)}
.qt td.pc{padding:0 1px;text-align:center;min-width:22px}
.qt.tight{font-size:12.5px}
.qt.tight td,.qt.tight th{padding:4px 3px}
.qt.tight .chip{min-width:28px;padding:1px 4px;font-size:11px}
.qt.tight th.pc,.qt.tight td.pc{min-width:17px;padding:0 1px}
.qt.tight i.on{height:20px}
.qt .sep{border-left:1px solid rgba(107,26,26,.25)}
.qt i.on{display:block;height:24px;border-radius:3px;background:var(--mahogany)}
.qt i.on.kit{background:#B9877A}
.qt i.on.part{opacity:.4}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--mahogany);vertical-align:0}
.dot.kit{background:#B9877A}
.tl{margin-top:6px}
.tlrow{margin:8px 0}
.tln{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.tln .h{color:var(--muted);font-size:12px}
.track{position:relative;height:14px;background:rgba(13,13,13,.04);border-radius:7px;margin-top:3px;overflow:hidden}
.track .gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(13,13,13,.08)}
.track .gl.close{background:rgba(107,26,26,.35)}
.track .seg{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--mahogany)}
.track .seg.kit{background:#B9877A}
.track .seg.draft{background:repeating-linear-gradient(45deg,var(--mahogany) 0 4px,#B9877A 4px 8px);opacity:.75}
select.date{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:2px}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.zone{border-radius:18px;padding:16px 14px 18px;margin:20px -4px 0;position:relative}
.zone.plan{background:#F3E1D3;border:1px solid rgba(107,26,26,.18)}
.zone.plan .panel,.zone.plan .card:not(.hl){background:#FFF8F1}
.zone.look{background:var(--card);border:1px solid var(--line)}
.zone h2:first-of-type{margin-top:6px}
.ztag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--mahogany);color:var(--cream)}
.zone.look .ztag{background:var(--ink)}
.tabs.wk{flex-wrap:wrap;overflow:visible}
.tabs.wk button{font-size:13px;padding:5px 11px}
.heads{background:#FFF8F1;border:1px solid rgba(107,26,26,.35);border-left:5px solid var(--mahogany);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.heads .hh{font-weight:600;color:var(--mahogany);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.heads ul{margin:6px 0 0;padding-left:18px}.heads li{margin:4px 0}
.owner input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;width:100%;max-width:260px}
.btn{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:10px;background:var(--mahogany);color:var(--cream);padding:9px 16px;cursor:pointer;margin-top:8px}
.btn.ghost{background:none;color:var(--mahogany);border:1px solid var(--mahogany)}
.loading{color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading">Loading…</p></div>
<script>
(function () {
  'use strict';
  /* ===== Owner's staffing rules (Linda, 21 Oct 2026). Sales = net sales ex-GST per hour. ===== */
  /* Thresholds are sales INCLUDING GST per hour - how Linda reads them on her phone (owner, 21 Oct 2026).
     Sales are stored net ex-GST, so they are multiplied by GST before comparing and in the tables. */
  var GST = 1.1;
  /* Owner's planning percentages (21 Oct 2026): overheads 18% and COGS 31% of NET sales. */
  var OVERHEADS = 0.18, COGS = 0.29;
  function profitOf(net, wages) { return net - wages - net * (OVERHEADS + COGS); }
  var RULES = {
    upTo2: 500,      /* under $500/h incl GST: 2 front-of-house */
    four: 900,       /* $500-$899: 3; from $900 incl GST (about $800 net): definitely 4 */
    five: 1200,      /* $1,200/h and up: 5 if it lasts, else 4 */
    six: 1500,       /* $1,500/h and up: a sixth person is very useful - 6 if it lasts, else 5 */
    lasts: 8,        /* "a few big hours in a row" = some 2-hour stretch around that time averages at least $1,200 */
    minShift: 8,     /* weekend suggested shifts at least 2 hours */
    minWeekday: 16,  /* owner 21 Oct 2026: weekday shifts never under 4 hours (ideally 5) */
    idealWeekday: 20
  };
  var SLOT0 = 360, N = 42, MON = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  var S = { sel: null, me: null, weeks: {}, allWeeks: [], span: 4, plan: { week: null, sched: {}, loading: false, err: null, tab: 0 }, settings: null, custom: null, closers: 2, tab: 0, loading: null, errors: [] };
  try { var c = localStorage.getItem('ro_closers'); if (c === '3') S.closers = 3; var sp = localStorage.getItem('ro_span'); if (sp) S.span = +sp || 4; } catch (e) {}

  /* ---------- helpers ---------- */
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function addDay(d, n) { var x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function dowOf(d) { return (new Date(d + 'T12:00:00Z').getUTCDay() + 6) % 7; }
  function nice(d) { var x = new Date(d + 'T12:00:00Z'); return x.getUTCDate() + ' ' + MONTHS[x.getUTCMonth()]; }
  function tl(min) { var h = Math.floor(min / 60), m = min % 60; return (((h + 11) % 12) + 1) + (m ? ':' + (m < 10 ? '0' : '') + m : '') + (h < 12 ? 'am' : 'pm'); }
  function money(x) { return '$' + Math.round(x).toLocaleString('en-AU'); }
  function hrs(x) { var r = Math.round(x * 4) / 4; return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(2).replace(/0$/, '')); }
  function half(x) { var r = Math.round(x * 2) / 2; return r % 1 === 0 ? r.toFixed(0) : r.toFixed(1); }
  function median(a) { if (!a.length) return 0; var b = a.slice().sort(function (p, q) { return p - q; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function api(path, opt) { return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); }); }

  /* ---------- the rules ---------- */
  function rates(sales) { /* $ per hour around each 15-min slot (the hour from 30 min before to 30 min after) */
    var out = [];
    for (var i = 0; i < N; i++) { var s = 0; for (var k = i - 2; k <= i + 1; k++) if (k >= 0 && k < N) s += sales[k]; out.push(s / 100 * GST); }
    return out;
  }
  function lasts(sales, i, th) { /* is there a 2-hour stretch including this slot averaging >= th per hour? */
    for (var s = i - RULES.lasts + 1; s <= i; s++) {
      if (s < 0 || s + RULES.lasts > N) continue;
      var t = 0; for (var k = s; k < s + RULES.lasts; k++) t += sales[k];
      if (t * 4 / 100 * GST / RULES.lasts >= th) return true;
    }
    return false;
  }
  function salesNeed(r, sales, i) {
    var x = r[i];
    if (x < RULES.upTo2) return 2;
    if (x < RULES.four) return 3;
    if (x >= RULES.six) return lasts(sales, i, RULES.six) ? 6 : 5;
    if (x >= RULES.five) return lasts(sales, i, RULES.five) ? 5 : 4;
    return 4;
  }
  function fohNeed(dow, sales, closers) {
    var r = rates(sales), need = [], weekend = dow >= 5;
    for (var i = 0; i < N; i++) {
      var t = SLOT0 + 15 * i, n = 0;
      if (!weekend) {
        if (t < 405) n = 0;                              /* before 6:45 */
        else if (t < 480) n = 1;                         /* 6:45 opener, open 7am */
        else if (t < 525) n = 2;                         /* 8:00 second person */
        else if (t < 780) n = Math.max(3, salesNeed(r, sales, i)); /* owner: always at least 3 from 8:45 to 1pm */
        else if (t < 900) n = salesNeed(r, sales, i);           /* trading: by sales, never under 2 */
        else if (t < 930) n = 2;                         /* close 3pm, two pack down till 3:30 */
      } else {
        if (t < 465) n = 0;
        else if (t < 480) n = 2;                         /* two set up from 7:45, open 8am */
        else if (t >= 525 && t < 780) n = Math.max(3, salesNeed(r, sales, i)); /* at least 3 from 8:45 to 1pm */
        else if (t < 900) n = salesNeed(r, sales, i);
        else if (t < 930) n = closers;
      }
      need.push(n);
    }
    return need;
  }
  function kitNeed() { var a = []; for (var i = 0; i < N; i++) { var t = SLOT0 + 15 * i; a.push(t >= 420 && t < 900 ? 2 : 0); } return a; }

  /* Turn a staff-needed curve into shifts: fill short dips, start people as numbers rise,
     send the earliest starter home first as numbers fall, at least 2 hours each. */
  function toShifts(need, minLen) {
    minLen = minLen || RULES.minShift;
    var c = [];
    for (var i = 0; i < N; i++) {
      var l = 0, r = 0;
      for (var k = Math.max(0, i - 3); k <= i; k++) l = Math.max(l, need[k]);
      for (k = i; k <= Math.min(N - 1, i + 3); k++) r = Math.max(r, need[k]);
      c.push(Math.max(need[i], Math.min(l, r)));
    }
    var active = [], shifts = [];
    for (i = 0; i <= N; i++) {
      var cur = i < N ? c[i] : 0;
      while (active.length < cur) active.push(i);
      while (active.length > cur) {
        var s = active.shift(), e = i;
        if (e - s < minLen) {   /* too short: stretch the finish (not past 3:30pm), else start earlier */
          var last = 38;
          e = Math.max(e, Math.min(last, s + minLen));
          if (e - s < minLen) s = Math.max(0, e - minLen);
        }
        shifts.push([s, e]);
      }
    }
    shifts.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    return shifts;
  }

  /* Owner (21 Oct 2026): shifts longer than 5 hours get a 30-minute break.
     Each break goes 2 to 4.5 hours into the shift (so nobody works more than 5 hours
     straight), at the time that leaves the most cover against what's needed,
     then the quietest pace; breaks are placed one shift at a time so they don't stack. */
  function placeBreaks(shifts, need, pace) {
    var on = [];
    for (var i = 0; i < N; i++) on.push(0);
    shifts.forEach(function (x) { for (var k = x[0]; k < x[1]; k++) on[k]++; });
    return shifts.map(function (x) {
      var len = x[1] - x[0], out = { s: x[0], e: x[1], br: null };
      if (len <= 20) return out;
      var best = null;
      for (var b = x[0] + 8; b <= Math.min(x[0] + 18, x[1] - 4); b++) {
        var slack = Math.min(on[b] - need[b], on[b + 1] - need[b + 1]);
        var quiet = -(pace[b] + pace[b + 1]);
        if (!best || slack > best.slack || (slack === best.slack && quiet > best.quiet)) best = { b: b, slack: slack, quiet: quiet };
      }
      if (best) { out.br = best.b; on[best.b]--; on[best.b + 1]--; }
      return out;
    }).concat([]).map(function (o) { o.on = on; return o; });
  }
  /* Owner (21 Oct 2026): breaks must not drop cover below what's needed (e.g. 3 on from
     8:45 to 1pm even while someone is on break). After placing breaks, any slot left short
     is covered by the cheapest fix: start a later shift earlier, keep an earlier shift on
     longer, or (if neither works) add a shift. Then breaks are placed again, until it holds. */
  function buildRoster(need, minLen, pace) {
    var shifts = toShifts(need, minLen), rows = null, close = 38;
    for (var iter = 0; iter < 15; iter++) {
      rows = placeBreaks(shifts, need, pace);
      var on = rows.length ? rows[0].on : [], k = -1;
      for (var i = 0; i < N; i++) if (on[i] < need[i]) { k = i; break; }
      if (k < 0) return rows;
      var e = k; while (e + 1 < N && on[e + 1] < need[e + 1]) e++;
      /* people already working through the whole gap can't help */
      var best = null;
      shifts.forEach(function (x, j) {
        var r = rows[j], onAll = true;
        for (var q = k; q <= e; q++) {
          var working = q >= r.s && q < r.e && !(r.br != null && q >= r.br && q < r.br + 2);
          if (!working) { onAll = false; break; }
        }
        if (onAll) return;
        if (x[0] > k) { var c1 = x[0] - k; if (!best || c1 < best.c) best = { c: c1, j: j, s: k, e: x[1] }; }
        if (x[1] <= e + 1 && e + 1 <= close) { var c2 = e + 1 - x[1]; if (c2 >= 0 && (!best || c2 < best.c)) best = { c: c2, j: j, s: x[0], e: e + 1 }; }
      });
      if (best && best.c <= 8) shifts[best.j] = [best.s, best.e];
      else {
        var ns = k, ne = Math.max(e + 1, k + minLen);
        if (ne > close) { ne = Math.max(e + 1, close); ns = Math.max(0, Math.min(k, ne - minLen)); }
        shifts.push([ns, ne]);
      }
      shifts.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    }
    return rows;
  }
  /* Front-of-house roster builder (owner rules, 21 Oct 2026):
     - cover what's needed in every 15 min, including while people are on break
     - shifts over 5 h get a 30-min break; at most 2 such long shifts on a weekday,
       3 on a weekend (4 on a big weekend day, $8,000+ incl GST)
     - one closer is the supervisor: a long shift starting around 8am and finishing at close
     - as few people as possible (weekends never more than 8), then as few hours as possible
     - weekday shifts at least 4 h; no shifts starting late in the day just to fill a gap
     It tries many rosters (a small search, same result every time) and keeps the best. */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function fohCost(shifts, need, pace, o) {
    var rows = placeBreaks(shifts, need, pace), on = rows.length ? rows[0].on : new Array(N).fill(0);
    var c = 0, longs = 0, sup = false;
    for (var i = 0; i < N; i++) { var d = need[i] - on[i]; if (d > 0) c += 1000 * d; else c += -d * 3; }
    shifts.forEach(function (x) {
      var len = x[1] - x[0];
      if (len > 20) longs++;
      c += len * 4;                                   /* hours */
      if (x[0] >= 20) c += 150 + (x[0] - 20) * 20;   /* starting late morning or later: avoid */
      if (len < 16) c += 80;                          /* short shifts */
      if (x[0] >= o.supFrom && x[0] <= o.supTo && x[1] === o.close && len > 20) sup = true;
    });
    c += shifts.length * 45;                          /* each extra person */
    if (longs > o.maxLong) c += 3000 * (longs - o.maxLong);
    if (shifts.length > o.maxPeople) c += 3000 * (shifts.length - o.maxPeople);
    if (!sup) c += 3000;
    return { c: c, rows: rows };
  }
  function optimiseFoh(need, pace, o) {
    var fix = function (x) {
      var a = Math.max(o.earliest, Math.min(x[0], o.close - o.minLen)), b = Math.min(o.close, Math.max(x[1], a + o.minLen));
      if (b - a > 36) b = a + 36;                     /* 9 hours max */
      return [a, b];
    };
    var sup = [o.supFrom + 1, o.close];
    var start = toShifts(need, o.minLen).map(fix);
    if (!start.some(function (x) { return x[0] >= o.supFrom && x[0] <= o.supTo && x[1] === o.close; })) start.push(sup);
    var best = { sh: start, c: fohCost(start, need, pace, o).c };
    var r = rng(12345);
    for (var restart = 0; restart < 4; restart++) {
      var cur = best.sh.map(function (x) { return x.slice(); }), cc = best.c;
      for (var it = 0; it < 3500; it++) {
        var T = 300 * Math.pow(0.002, it / 3500);
        var nx = cur.map(function (x) { return x.slice(); }), m = r(), j = Math.floor(r() * nx.length);

      if (!HOLIDAYS[d]) continue;
      var dw = dowOf(d), extra = '';

      api('/api/roster/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: inp.value }) })
        .then(function () { S.me.managerPasswordSet = true; msg.textContent = 'Saved. Send her the link and this password.'; inp.value = ''; })
        .catch(function () { msg.textContent = 'Use at least 6 characters.'; });
    };
    var rb = el('button', 'btn ghost', 'Re-fetch these weeks');
    rb.style.marginLeft = '8px';
    rb.onclick = function () { loadWeeks(true); };
    p.appendChild(inp); p.appendChild(el('br')); p.appendChild(b); p.appendChild(rb); p.appendChild(msg);
    app.appendChild(p);
  }

  /* ---------- start ---------- */
  api('/api/roster/me').then(function (me) {
    S.me = me;
    api('/api/roster/settings').then(function (st) { S.settings = st; if (!S.plan.week) S.plan.week = addDay(me.today, 7 - dowOf(me.today)); loadPlan(false); }).catch(function () {});
    var dow = dowOf(me.today);
    var lastMon = addDay(addDay(me.today, -dow), -7);
    for (var w = me.firstWeek; w <= lastMon; w = addDay(w, 7)) S.allWeeks.push(w);
    S.tab = dow;
    try { var sv = JSON.parse(localStorage.getItem('ro_sel') || 'null'); if (Array.isArray(sv)) { sv = sv.filter(function (x) { return S.allWeeks.indexOf(x) >= 0; }); if (sv.length) S.sel = sv; } } catch (e) {}
    loadWeeks(false);
  }).catch(function () { document.getElementById('app').innerHTML = '<p class="loading">Couldn\u2019t load. Check your connection and refresh the page.</p>'; });
})();
</script>
</body>
</html>
