<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bainz New Staff</title>
<style>
:root{--bg:#FDF7EE;--card:#FFFBF5;--blush:#F0DACB;--ink:#6B1A1A;--muted:#8C4A44;--line:#E3C9BA;--ok:#3E6B35;--err:#B3261E;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:24px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:20px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:26px;margin:0}
a{color:var(--ink)}
.back{font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row > div{min-width:0}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.no{color:var(--err)} .pill.wait{color:var(--muted)}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:focus-visible,input:focus,select:focus{outline:2px solid var(--ink);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.form{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg label{padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.newlink{background:var(--blush);border-radius:10px;padding:12px;display:grid;gap:8px}
.newlink code{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;user-select:all}
.list{display:grid;gap:10px}
.item{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.item:first-child{border-top:0;padding-top:0}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--err);font-size:13px;overflow-wrap:anywhere}
.notes{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
</style>
</head><body>
<div class="wrap">
  <header><h1>New staff</h1><a class="back" href="/">← Dashboard</a></header>

  <section class="card" id="conn">
    <h2>Connections</h2>
    <div class="row"><div><b>Xero payroll</b><div class="muted" id="xeroText">Checking…</div></div><span id="xeroAct"></span></div>
    <div class="row"><div><b>Google Drive</b> <span class="muted">(hello@bainz.au)</span><div class="muted" id="driveText">Checking…</div></div><span id="driveAct"></span></div>
  </section>

  <section class="card">
    <h2>Send a new starter their form</h2>
    <form class="form" id="mk">
      <input type="text" id="fn" placeholder="First name (optional)" maxlength="40" autocomplete="off">
      <div class="seg" role="radiogroup" aria-label="Role">
        <label><input type="radio" name="role" value="foh" checked>Front of house</label>
        <label><input type="radio" name="role" value="kitchen">Kitchen</label>
      </div>
      <button class="btn" type="submit">Create link</button>
    </form>
    <div class="newlink" id="out" hidden>
      <div class="muted">Text or email this link. It works once and expires in 30 days.</div>
      <code id="url"></code>
      <div><button class="btn small" type="button" id="copy">Copy link</button> <span class="muted" id="copied"></span></div>
    </div>
  </section>

  <section class="card">
    <h2>Waiting for</h2>
    <div class="list" id="links"></div>
  </section>

  <section class="card">
    <h2>Forms received</h2>
    <div class="list" id="subs"></div>
  </section>
</div>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function when(iso){ try { return new Date(iso).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; } }
  function role(r){ return r === 'kitchen' ? 'Kitchen' : 'Front of house'; }
  function post(path, body){ return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json();}); }

  function load(){
    fetch('/api/staff').then(function(r){ if(r.status===401){ location.href='/'; return null; } return r.json(); }).then(function(d){
      if(!d) return;
      if (d.xero.payroll) { $('#xeroText').textContent = 'Ready: new starters are added to Xero automatically.'; $('#xeroAct').innerHTML = '<span class="pill ok">Connected</span>'; }
      else { $('#xeroText').textContent = d.xero.connected ? 'Connected for the dashboard only. Reconnect once and click Allow so it can add employees.' : 'Not connected.'; $('#xeroAct').innerHTML = '<a class="btn small" href="/auth/accounting/start">Reconnect Xero</a>'; }
      if (d.drive.connected) { $('#driveText').textContent = 'Ready: records go to the "Bainz Staff Records" folder.'; $('#driveAct').innerHTML = '<span class="pill ok">Connected</span>'; }
      else if (d.drive.keysSet) { $('#driveText').textContent = 'Sign in as hello@bainz.au and click Allow.'; $('#driveAct').innerHTML = '<a class="btn small" href="/auth/drive/start">Connect Google Drive</a>'; }
      else { $('#driveText').textContent = 'Waiting for the Google setup step.'; $('#driveAct').innerHTML = '<span class="pill wait">Not set up</span>'; }

      $('#links').innerHTML = d.links.length ? d.links.map(function(l){
        return '<div class="item"><div class="row"><div><b>'+esc(l.firstName||'New starter')+'</b> · '+role(l.role)+'<div class="muted">Link made '+when(l.created)+'</div></div><button class="btn ghost small" data-cancel="'+esc(l.code)+'">Cancel link</button></div></div>';
      }).join('') : '<p class="empty">No open links.</p>';

      $('#subs').innerHTML = d.subs.length ? d.subs.map(function(s){
        var x = s.xero.ok ? '<span class="pill ok">In Xero</span>' : '<span class="pill no">Not in Xero</span>';
        var g = s.drive.ok ? '<a class="btn ghost small" href="'+esc(s.drive.folderUrl)+'" target="_blank" rel="noopener">Open in Drive</a>' : '<span class="pill no">Not in Drive</span>';
        var errs = (s.xero.ok?'':'<div class="err">Xero: '+esc(s.xero.error)+'. Add them by hand using the record in Drive.</div>')
          + (s.drive.ok?'':'<div class="err">Drive: '+esc(s.drive.error)+'. Ask them to send their ID photos again.</div>');
        var notes = (s.xero.notes||[]).length ? '<ul class="notes">'+s.xero.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>' : '';
        return '<div class="item"><div class="row"><div><b>'+esc(s.name)+'</b> · '+role(s.role)+'<div class="muted">Sent '+when(s.submittedAt)+(s.xero.startDate?' · Xero start date '+esc(s.xero.startDate):'')+'</div></div><div>'+x+' '+g+'</div></div>'+errs+notes+'<div><button class="btn ghost small" data-remove="'+esc(s.id)+'">Remove from this list</button></div></div>';
      }).join('') : '<p class="empty">Nothing yet.</p>';
    });
  }

  $('#mk').addEventListener('submit', function(e){
    e.preventDefault();
    var r = document.querySelector('input[name=role]:checked').value;
    post('/api/staff/link',{firstName:$('#fn').value.trim(), role:r}).then(function(d){
      if (!d.ok) return;
      $('#url').textContent = d.url; $('#out').hidden = false; $('#copied').textContent=''; $('#fn').value=''; load();
    });
  });
  $('#copy').addEventListener('click', function(){
    var t = $('#url').textContent;
    var done = function(){ $('#copied').textContent = 'Copied'; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){ selectUrl(); });
    else selectUrl();
  });
  function selectUrl(){ var r=document.createRange(); r.selectNodeContents($('#url')); var s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#copied').textContent='Selected: press copy'; }
  document.addEventListener('click', function(e){
    var c = e.target.closest('[data-cancel]'); if (c) post('/api/staff/link/cancel',{code:c.getAttribute('data-cancel')}).then(load);
    var r = e.target.closest('[data-remove]'); if (r) post('/api/staff/remove',{id:r.getAttribute('data-remove')}).then(load);
  });
  load();
})();
</script>
</body></html>
